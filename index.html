<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><meta name="apple-mobile-web-app-capable" content="yes"><title>Maintenance · Atelier</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15283b;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#102a43;color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}header h1{font-size:23px;margin:0}header p{opacity:.8;font-size:13px;margin:5px 0 0}.shell{max-width:760px;margin:auto;padding:16px 14px 100px}.tabs{position:sticky;top:0;z-index:5;background:#f4f7fa;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 0 15px}.tabs button{border:1px solid #d8e1e9;border-radius:12px;padding:13px;background:white;font-weight:700;color:#526477}.tabs button.active{background:#1263a4;color:white;border-color:#1263a4}.card{background:white;border:1px solid #e0e8ef;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 3px 14px #102a4308}.card h2{font-size:18px;margin:0 0 12px}.muted{color:#667789;font-size:13px}.btn{border:0;border-radius:11px;background:#1263a4;color:white;padding:12px 15px;font-weight:700}.btn.secondary{background:#eaf2f9;color:#12578c}.btn.danger{background:#fff0ee;color:#aa2e25}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd8e2;border-radius:10px;background:white;color:#15283b}textarea{min-height:90px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row h2{margin:0}.pill{font-size:12px;border-radius:30px;padding:5px 9px;background:#e9f1f8;color:#255f8b;font-weight:700}.pill.done{background:#e4f5ea;color:#207447}.pill.progress{background:#fff0d8;color:#986000}.item{border:1px solid #e2eaf0;border-radius:12px;padding:12px;margin:9px 0}.item strong{display:block;margin-bottom:4px}.item p{margin:5px 0;color:#526477;font-size:14px;white-space:pre-wrap}.item .actions{margin-top:11px}.item .btn{padding:9px;font-size:13px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.calendar-head strong{text-transform:capitalize}.iconbtn{background:#eaf2f9;border:0;border-radius:10px;padding:9px 13px;color:#12578c;font-weight:bold}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;color:#6e7f90;font-size:12px;font-weight:700;padding:6px 0}.day{height:54px;border:1px solid #e1e9ef;background:#fff;border-radius:10px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:5px;color:#223b52}.day.selected{border:2px solid #1263a4;background:#eaf4fc;font-weight:800}.dots{display:flex;gap:3px}.dot{height:6px;width:6px;border-radius:50%;background:#e7a126}.dot.done{background:#2f9c60}.empty{color:#77899a;text-align:center;padding:25px 10px}.hidden{display:none!important}.notice{padding:12px;border-radius:12px;background:#fff6e6;color:#805b1b;font-size:13px;margin:10px 0}.qr{display:flex;justify-content:center;padding:15px}.qr canvas,.qr img{max-width:100%}.section-title{font-size:15px;font-weight:800;margin:16px 0 8px}.back{background:none;border:0;color:#1263a4;font-weight:700;padding:0 0 12px}.small{font-size:12px}.link{overflow-wrap:anywhere}.footer{font-size:12px;color:#7a8996;text-align:center;padding:12px}@media(min-width:650px){.shell{padding:24px 22px 80px}.day{height:70px}}
</style></head><body><header><div style="max-width:760px;margin:auto"><h1>Maintenance</h1><p>QR code des machines · Planning des interventions</p></div></header><main class="shell"><div class="tabs"><button id="tab-machines" onclick="go('machines')">▣ Machines / QR</button><button id="tab-planning" onclick="go('planning')">▦ Planning</button></div><div id="view"></div><div class="footer">Prototype local · Sauvegardez régulièrement vos données</div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const STORE='gmao_simple_v1';let data=load(),page='machines',selected=new Date(),shown=new Date(),machineId=null;
function load(){try{const d=JSON.parse(localStorage.getItem(STORE));if(d&&Array.isArray(d.machines)&&Array.isArray(d.tasks))return d}catch(e){}return {machines:[],tasks:[]}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){alert('Impossible de sauvegarder. Exportez vos données et libérez de l’espace.') }}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function displayDate(s){if(!s)return '—';let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}
function machineName(id){return data.machines.find(x=>x.id===id)?.name||'Machine supprimée'}
function go(p,id){page=p;machineId=id||null;render()}
function render(){document.getElementById('tab-machines').classList.toggle('active',page==='machines'||page==='machine');document.getElementById('tab-planning').classList.toggle('active',page==='planning');document.getElementById('view').innerHTML=page==='planning'?planning():page==='machine'?machineView():machinesView();if(page==='machine')drawQR()}
function machinesView(){return `<div class="card"><div class="row"><h2>Mes machines</h2><button class="btn" onclick="machineForm()">+ Ajouter</button></div><p class="muted">Ajoutez une machine pour créer son QR code et conserver son historique.</p>${data.machines.length?data.machines.map(m=>`<div class="item"><div class="row"><div><strong>${esc(m.name)}</strong><span class="muted">${esc(m.location||'Emplacement non renseigné')}</span></div><button class="btn secondary" onclick="go('machine','${m.id}')">Ouvrir</button></div></div>`).join(''):'<div class="empty">Aucune machine enregistrée.</div>'}</div><div class="card"><h2>Sauvegardes</h2><p class="muted">Les données sont conservées uniquement sur cet appareil et ce navigateur.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Exporter JSON</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importer JSON</button></div><input class="hidden" type="file" id="importFile" accept="application/json,.json" onchange="importData(this)"></div><div class="notice">Les QR codes peuvent être scannés avec l’appareil photo iPhone. Sur un autre téléphone, la fiche n’apparaîtra que si les données y ont été importées. Pour un historique partagé en direct, il faudra une base commune.</div>`}
function machineForm(id){const m=data.machines.find(x=>x.id===id);document.getElementById('view').innerHTML=`<div class="card"><button class="back" onclick="go('${m?'machine':'machines'}'${m?",'"+m.id+"'":''})">← Retour</button><h2>${m?'Modifier':'Ajouter'} une machine</h2><form id="machineForm"><label>Nom de la machine *</label><input name="name" required value="${esc(m?.name||'')}"><label>Emplacement</label><input name="location" value="${esc(m?.location||'')}"><label>Référence / numéro</label><input name="reference" value="${esc(m?.reference||'')}"><div class="actions" style="margin-top:18px"><button class="btn" type="submit">Enregistrer</button></div></form></div>`;document.getElementById('machineForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(m){m.name=f.get('name').trim();m.location=f.get('location').trim();m.reference=f.get('reference').trim()}else{id=uid();data.machines.push({id,name:f.get('name').trim(),location:f.get('location').trim(),reference:f.get('reference').trim()})}save();go('machine',id)}}
function machineView(){const m=data.machines.find(x=>x.id===machineId);if(!m)return `<div class="card">Machine introuvable. <button class="btn" onclick="go('machines')">Retour</button></div>`;const history=data.tasks.filter(t=>t.machineId===m.id&&t.status==='done').sort((a,b)=>(b.completedAt||b.date).localeCompare(a.completedAt||a.date));return `<button class="back" onclick="go('machines')">← Toutes les machines</button><div class="card"><div class="row"><div><h2>${esc(m.name)}</h2><span class="muted">${esc(m.location||'Emplacement non renseigné')} ${m.reference?'· '+esc(m.reference):''}</span></div><button class="btn secondary" onclick="machineForm('${m.id}')">Modifier</button></div><div class="qr" id="qr"></div><p class="muted small" style="text-align:center">Imprimez ce QR code et collez-le sur la machine.</p><div class="actions"><button class="btn secondary" onclick="printQR()">Imprimer QR</button><button class="btn danger" onclick="deleteMachine('${m.id}')">Supprimer machine</button></div></div><div class="card"><div class="row"><h2>Historique des interventions</h2><button class="btn" onclick="taskForm(null,'${m.id}',true)">+ Intervention</button></div>${history.length?history.map(taskItem).join(''):'<div class="empty">Aucune intervention terminée.</div>'}</div><div class="card"><h2>Tâches à venir / en cours</h2>${data.tasks.filter(t=>t.machineId===m.id&&t.status!=='done').sort((a,b)=>a.date.localeCompare(b.date)).map(taskItem).join('')||'<div class="empty">Aucune tâche en attente.</div>'}</div>`}
function drawQR(){let node=document.getElementById('qr');if(!node)return;const url=new URL(location.href);url.searchParams.set('machine',machineId);url.hash='';if(typeof QRCode==='undefined'){node.innerHTML='<p class="notice">Connexion nécessaire au premier chargement pour générer le QR code.</p><p class="small link">'+esc(url.href)+'</p>';return}new QRCode(node,{text:url.href,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}
function printQR(){const m=data.machines.find(x=>x.id===machineId);const img=document.querySelector('#qr img')?.src||document.querySelector('#qr canvas')?.toDataURL();if(!img){alert('QR code indisponible. Connectez-vous à Internet puis rechargez.');return}const w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres surgissantes pour imprimer.');return}w.document.write('<html><head><title>QR '+esc(m.name)+'</title></head><body style="text-align:center;font-family:sans-serif"><h2>'+esc(m.name)+'</h2><img src="'+img+'"><p>'+esc(m.reference||'')+'</p></body></html>');w.document.close();setTimeout(()=>w.print(),450)}
function deleteMachine(id){if(data.tasks.some(t=>t.machineId===id)){alert('Cette machine possède des tâches ou un historique. Supprimez ou réaffectez-les avant de supprimer la machine.');return}if(confirm('Supprimer définitivement cette machine ?')){data.machines=data.machines.filter(x=>x.id!==id);save();go('machines')}}
function planning(){const first=new Date(shown.getFullYear(),shown.getMonth(),1),offset=(first.getDay()+6)%7,n=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let i=1;i<=n;i++){const d=new Date(shown.getFullYear(),shown.getMonth(),i),k=dateKey(d),ts=data.tasks.filter(t=>t.date===k||(t.status==='done'&&t.completedAt===k));cells+=`<button class="day ${dateKey(selected)===k?'selected':''}" onclick="pickDay(${i})">${i}<span class="dots">${ts.some(t=>t.status==='done')?'<span class="dot done"></span>':''}${ts.some(t=>t.status!=='done')?'<span class="dot"></span>':''}</span></button>`}const k=dateKey(selected),done=data.tasks.filter(t=>t.status==='done'&&t.completedAt===k),planned=data.tasks.filter(t=>t.date===k&&t.status!=='done');return `<div class="card"><div class="row"><h2>Planning</h2><button class="btn" onclick="taskForm(null,null,false)">+ Tâche</button></div><div class="calendar-head"><button class="iconbtn" onclick="moveMonth(-1)">‹</button><strong>${shown.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</strong><button class="iconbtn" onclick="moveMonth(1)">›</button></div><div class="cal">${['L','M','M','J','V','S','D'].map(d=>'<div class="dow">'+d+'</div>').join('')}${cells}</div><p class="muted small">🟢 Terminée · 🟠 À faire / en cours</p></div><div class="card"><h2>${selected.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h2><div class="section-title">Interventions réalisées (${done.length})</div>${done.map(taskItem).join('')||'<div class="muted">Aucune intervention terminée ce jour.</div>'}<div class="section-title">Tâches prévues (${planned.length})</div>${planned.map(taskItem).join('')||'<div class="muted">Aucune tâche prévue.</div>'}</div>`}
function pickDay(d){selected=new Date(shown.getFullYear(),shown.getMonth(),d);render()}
function moveMonth(n){shown=new Date(shown.getFullYear(),shown.getMonth()+n,1);selected=new Date(shown);render()}
function taskItem(t){return `<div class="item"><div class="row"><strong>${esc(t.title)}</strong><span class="pill ${t.status==='done'?'done':t.status==='progress'?'progress':''}">${t.status==='done'?'Terminée':t.status==='progress'?'En cours':'À faire'}</span></div><p>${esc(machineName(t.machineId))} · ${displayDate(t.date)}${t.technician?' · '+esc(t.technician):''}</p>${t.notes?'<p>'+esc(t.notes)+'</p>':''}${t.status==='done'?'<p class="small">Réalisée le '+displayDate(t.completedAt)+'</p>':''}<div class="actions"><button class="btn secondary" onclick="taskForm('${t.id}')">Modifier</button>${t.status!=='done'?`<button class="btn" onclick="setStatus('${t.id}','${t.status==='progress'?'done':'progress'}')">${t.status==='progress'?'Terminer':'Démarrer'}</button>`:''}<button class="btn danger" onclick="deleteTask('${t.id}')">Supprimer</button></div></div>`}
function taskForm(id,preMachine,immediate){const t=data.tasks.find(x=>x.id===id);if(!data.machines.length){alert('Ajoutez d’abord une machine.');go('machines');return}const currentMachine=preMachine||t?.machineId||data.machines[0].id;document.getElementById('view').innerHTML=`<div class="card"><button class="back" onclick="render()">← Retour</button><h2>${t?'Modifier':'Ajouter'} ${immediate?'une intervention':'une tâche'}</h2><form id="taskForm"><label>Intervention / tâche *</label><input required name="title" value="${esc(t?.title||'')}" placeholder="Ex. Graissage roulements"><label>Machine concernée *</label><select name="machineId">${data.machines.map(m=>`<option value="${m.id}" ${currentMachine===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><label>Date prévue / date d'intervention</label><input type="date" required name="date" value="${esc(t?.date||dateKey(immediate?new Date():selected))}"><label>Technicien</label><input name="technician" value="${esc(t?.technician||'')}"><label>Type</label><select name="type">${['Préventive','Corrective','Contrôle','Autre'].map(v=>`<option ${t?.type===v?'selected':''}>${v}</option>`).join('')}</select><label>Compte rendu / consignes</label><textarea name="notes" placeholder="Travaux réalisés, observations…">${esc(t?.notes||'')}</textarea><label>Statut</label><select name="status"><option value="todo" ${(!t||t.status==='todo')&&!immediate?'selected':''}>À faire</option><option value="progress" ${t?.status==='progress'?'selected':''}>En cours</option><option value="done" ${t?.status==='done'||(!t&&immediate)?'selected':''}>Terminée</option></select><div class="actions" style="margin-top:18px"><button class="btn" type="submit">Enregistrer</button><button type="button" class="btn secondary" onclick="render()">Annuler</button></div></form></div>`;document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),status=f.get('status');const obj={id:id||uid(),title:f.get('title').trim(),machineId:f.get('machineId'),date:f.get('date'),technician:f.get('technician').trim(),type:f.get('type'),notes:f.get('notes').trim(),status,completedAt:status==='done'?(t?.completedAt||dateKey(new Date())):null};if(t)Object.assign(t,obj);else data.tasks.push(obj);save();render()}}
function setStatus(id,status){const t=data.tasks.find(x=>x.id===id);if(!t)return;if(status==='done'){const notes=prompt('Compte rendu de l’intervention (obligatoire) :',t.notes||'');if(notes===null)return;if(!notes.trim()){alert('Renseignez le travail effectué pour terminer.');return}t.notes=notes.trim();t.completedAt=dateKey(new Date())}else t.completedAt=null;t.status=status;save();render()}
function deleteTask(id){if(confirm('Supprimer cette tâche / intervention ? Cette action est définitive.')){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sauvegarde-gmao-'+dateKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(el){const file=el.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.machines)||!Array.isArray(d.tasks))throw Error('Format invalide');if(!confirm('Remplacer les données de cet appareil par celles du fichier ? Exportez d’abord vos données actuelles.'))return;data={machines:d.machines,tasks:d.tasks};save();go('machines')}catch(e){alert('Import impossible : '+e.message)}finally{el.value=''}}
const urlMachine=new URL(location.href).searchParams.get('machine');if(urlMachine){page='machine';machineId=urlMachine}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
